<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loop</title>
  <meta name="description" content="Post what you don't need. Someone nearby takes it. No names, no accounts.">
  <meta name="theme-color" content="#f6f1e8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/fraunces-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <p id="mock" class="mock" hidden>Demo mode: canned Gemini draft (model offline)</p>
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <svg class="loop-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 18.6c3.1.2 6.9-.9 9.7-3.6 3.9-3.7 5.3-10 1.3-11.4-3.6-1.3-6.1 2.6-5.2 7.1.9 4.6 5.6 8.6 14.2 7.3"/></svg>
        <span>Loop</span>
      </a>
      <a id="line" class="ear" hidden></a>
      <div id="lang-control"></div>
    </div>
  </header>

  <main id="view" class="wrap"></main>

  <p id="net" class="net" hidden>Can't reach Loop. Retrying…</p>
  <p id="toast" class="toast" aria-hidden="true" hidden></p>
  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="wrap">Loop needs JavaScript turned on.</p></noscript>
</body>
</html>
