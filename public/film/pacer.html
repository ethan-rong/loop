<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loop Pacer</title>
<style>
  @font-face { font-family: 'Space Grotesk'; src: url('/fonts/space-grotesk-latin-700-normal.woff2') format('woff2'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Space Grotesk'; src: url('/fonts/space-grotesk-latin-500-normal.woff2') format('woff2'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'JetBrains Mono'; src: url('/fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  /* Layout: one screen. Header strip (shot, clock), the script as a flowing block, a control bar pinned to the bottom. */
  :root { --paper:#f6f1e3; --card:#ffffff; --ink:#0b0d17; --muted:#4a5068; --dim:#c9c4b4; --lime:#c8ff3c; --coral:#ff6b57; --rule:#0b0d17; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; font-weight: 500; }
  .app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 24px; border-bottom: 2px solid var(--rule); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
  header .shot { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .shot b { color: var(--ink); background: var(--lime); padding: 2px 8px; border: 1.5px solid var(--ink); margin-right: 8px; font-weight: 700; }
  header .clock { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; }
  header .clock small { font-size: 14px; color: var(--muted); margin-left: 8px; }
  main { overflow: auto; padding: 32px 24px 24px; }
  .script { max-width: 1120px; margin: 0 auto; font-size: clamp(26px, 2.6vw, 38px); line-height: 1.45; font-weight: 500; }
  .beat { margin: 0 0 .6em; }
  .w { color: var(--dim); transition: color .12s linear, background-color .12s linear; border-radius: 4px; padding: 0 1px; }
  .w.done { color: var(--ink); }
  .w.now { color: var(--ink); background: var(--lime); box-shadow: 0 0 0 2px var(--lime); }
  .beat.future .w { color: var(--dim); }
  .beat .tag { display: block; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 .25em; }
  .beat.active .tag { color: var(--ink); }
  .beat.active .tag::before { content: '▶ '; }
  footer { position: sticky; bottom: 0; display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 12px 24px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 2px solid var(--rule); background: var(--paper); }
  .btn { font: inherit; font-weight: 700; font-size: 16px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 999px; padding: 12px 22px; min-height: 48px; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); }
  .btn.secondary { background: var(--card); color: var(--ink); box-shadow: none; }
  .btn:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
  .bar { height: 10px; border: 1.5px solid var(--ink); background: var(--card); position: relative; min-width: 0; }
  .bar > i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--lime); }
  .bar > b { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink); }
  .legend { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .count { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(246,241,227,.92); font-size: 160px; font-weight: 700; z-index: 10; }
  .count[hidden] { display: none; }
  @media (max-width: 700px) { header { flex-wrap: wrap; } header .clock { font-size: 22px; } main { padding: 20px 16px; } footer { grid-template-columns: 1fr 1fr; } .bar { grid-column: 1 / -1; order: -1; } .legend { display: none; } }
  @media (prefers-reduced-motion: reduce) { .w { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="shot" id="shot"><b>SHOT</b><span id="shot-name">Press Start</span></div>
    <div class="clock"><span id="clock">0:00.0</span><small>/ 1:58</small></div>
  </header>
  <main><div class="script" id="script"></div></main>
  <footer>
    <button class="btn" id="start" type="button">Start · 3-2-1</button>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="legend">space = play/pause · R = restart · read the lime word</div>
    <button class="btn secondary" id="restart" type="button">Restart</button>
  </footer>
</div>
<div class="count" id="count" hidden>3</div>
<script>
  const T = {"total": 118, "speechEnd": 115, "wpm": 155, "beats": [{"id": 1, "shot": "1 · watercolor lamp → dumpster", "start": 0.0, "end": 14.7, "text": "We all have stuff we don’t use anymore. Maybe you got a new lamp, and the old one’s just sitting there. For you, it’s taking up space. For someone else, it could be exactly what they need."}, {"id": 2, "shot": "2 · LISTINGS STOP AT “POSTED”", "start": 14.7, "end": 24.7, "text": "Giving it away should be simple. Less waste. One less thing to buy. But posting is only the beginning. There’s still a pickup to arrange."}, {"id": 3, "shot": "3 · the knot (3D) → Loop", "start": 24.7, "end": 26.6, "text": "That’s why I built Loop."}, {"id": 4, "shot": "4 · the board (desktop)", "start": 26.6, "end": 30.8, "text": "Post what you’re giving away. Or ask for what you need."}, {"id": 5, "shot": "5 · taker posts a need", "start": 30.8, "end": 34.3, "text": "Say someone needs a lamp, and you have one."}, {"id": 6, "shot": "6 · photo → Gemini draft → match", "start": 34.3, "end": 46.3, "text": "With just a photo, Gemini drafts the listing and finds their request. You check the details, correct the condition, and approve it. Gemini does the drafting. You make the decision."}, {"id": 7, "shot": "7 · the ticket", "start": 46.3, "end": 49.4, "text": "They accept and get a four-digit pickup code."}, {"id": 8, "shot": "8 · Loop in the thread", "start": 49.4, "end": 62.5, "text": "Then Loop joins the conversation. It asks you first, because you’re the one giving. Just tell Loop when and where: “Tomorrow at noon, Davis Library.” The other person confirms. Loop reminds you both."}, {"id": 9, "shot": "9 · the code → KEPT IN USE", "start": 62.5, "end": 72.9, "text": "At pickup, they show you the code. You enter it. Done. No personal details to exchange. Even when you meet. All you need is the code."}, {"id": 10, "shot": "10 · iPhone: Messages (Photon)", "start": 72.9, "end": 89.9, "text": "And the whole thing works in Messages. Through Photon’s Spectrum, Loop has its own iMessage number. Text it a photo. Give the draft a thumbs-up. Text a time. Enter the code at pickup. No app needed. And your phone number stays private."}, {"id": 11, "shot": "11 · a pile → six drafts", "start": 89.9, "end": 101.1, "text": "Have a whole pile of stuff? Gemini can turn a single photo into separate listings and see who might need them. You review the drafts, just like before."}, {"id": 12, "shot": "13–14 · code cards → end card", "start": 101.1, "end": 115.0, "text": "From one lamp to a whole pile, the idea stays the same: make the process simpler, so we waste less and make it easier for people in the community to help each other out."}]};
  const script = document.getElementById('script');
  const beats = T.beats.map((b) => {
    const el = document.createElement('p'); el.className = 'beat future';
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = 'Shot ' + b.shot + ' · ' + fmt(b.start) + '–' + fmt(b.end);
    el.appendChild(tag);
    const words = b.text.split(/\s+/).map((w, i, arr) => {
      const s = document.createElement('span'); s.className = 'w'; s.textContent = w + (i < arr.length - 1 ? ' ' : '');
      el.appendChild(s); return s;
    });
    script.appendChild(el);
    return { ...b, el, words };
  });
  const bar = document.getElementById('bar');
  beats.forEach((b) => { const m = document.createElement('b'); m.style.left = (b.start / T.total * 100) + '%'; bar.appendChild(m); });
  function fmt(s) { const m = Math.floor(s / 60), r = s - m * 60; return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1); }
  let t0 = null, offset = 0, raf = null, running = false;
  function now() { return running ? (performance.now() - t0) / 1000 + offset : offset; }
  function render() {
    const t = Math.min(now(), T.total);
    document.getElementById('clock').textContent = fmt(t);
    document.getElementById('fill').style.width = (t / T.total * 100) + '%';
    let current = null;
    beats.forEach((b) => {
      const inBeat = t >= b.start && t < b.end;
      b.el.classList.toggle('active', inBeat); b.el.classList.toggle('future', t < b.start);
      const p = Math.max(0, Math.min(1, (t - b.start) / (b.end - b.start)));
      const idx = Math.floor(p * b.words.length);
      b.words.forEach((w, i) => { w.classList.toggle('done', t >= b.end || i < idx); w.classList.toggle('now', inBeat && i === idx); });
      if (inBeat) current = b;
    });
    if (current) { document.getElementById('shot-name').textContent = current.shot; const nowEl = current.el.querySelector('.w.now'); if (nowEl) nowEl.scrollIntoView({ block: 'center', behavior: 'auto' }); }
    else if (t >= T.total) { document.getElementById('shot-name').textContent = 'End card · done'; running = false; return; }
    if (running) raf = requestAnimationFrame(render);
  }
  function play() { if (running) return; t0 = performance.now(); running = true; raf = requestAnimationFrame(render); document.getElementById('start').textContent = 'Pause'; }
  function pause() { if (!running) return; offset = now(); running = false; cancelAnimationFrame(raf); document.getElementById('start').textContent = 'Resume'; }
  function restart() { pause(); offset = 0; document.getElementById('start').textContent = 'Start · 3-2-1'; render(); }
  async function countIn() {
    const c = document.getElementById('count');
    for (const n of ['3', '2', '1']) { c.textContent = n; c.hidden = false; await new Promise((r) => setTimeout(r, 700)); }
    c.hidden = true; play();
  }
  document.getElementById('start').addEventListener('click', () => { if (running) pause(); else if (offset > 0) play(); else countIn(); });
  document.getElementById('restart').addEventListener('click', restart);
  document.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); document.getElementById('start').click(); } if (e.key === 'r' || e.key === 'R') restart(); });
  render();
</script>
</body>
</html>
